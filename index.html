<!DOCTYPE html>
<html lang="vi">
<head>
<!-- Facebook Preview -->
<meta property="og:title" content="🔥 Mã giảm giá Shopee 25% - Giảm tới 1TR">
<meta property="og:description" content="Click để lấy mã giảm giá Shopee mới nhất hôm nay">
<meta property="og:image" content="https://i.ibb.co/4gDTxR4k/voucher.jpg">
<meta property="og:url" content="">
<meta property="og:type" content="website">
<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f5f5f5;
    padding: 15px;
}

.container {
    max-width: 500px;
    margin: auto;
}

/* CARD */
.card {
    background: #fff;
    border-radius: 14px;
    padding: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    margin-bottom: 15px;
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.title {
    color: #ee4d2d;
    font-weight: bold;
    font-size: 18px;
}

.sub {
    color: #666;
    font-size: 13px;
    margin-top: 5px;
}

/* INPUT */
.input-box {
    margin-top: 15px;
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 14px;
}

/* BUTTON */
button {
    border: none;
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    font-weight: bold;
}

.paste {
    background: #ff6a00;
    color: white;
}

.create {
    width: 100%;
    background: #ee4d2d;
    color: white;
    margin-top: 10px;
}

.copy {
    width: 100%;
    background: #28a745;
    color: white;
    margin-top: 10px;
}

/* RESULT */
#result {
    margin-top: 10px;
    font-size: 14px;
    word-break: break-all;
    color: green;
}

/* GUIDE */
.step {
    display: flex;
    margin: 10px 0;
}

.number {
    width: 25px;
    height: 25px;
    background: #ee4d2d;
    color: white;
    border-radius: 50%;
    text-align: center;
    line-height: 25px;
    margin-right: 10px;
    font-size: 13px;
}

.fb-btn {
    background: #1877f2;
    color: white;
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    font-weight: bold;
}

/* MOBILE */
@media (max-width: 500px) {
    body { padding: 10px; }
}
</style>
</head>

<body>

<div class="container">

    <!-- CARD TẠO LINK -->
    <div class="card">
        <div class="header">
            <div>
                <div class="title">Tạo link</div>
                <div class="sub">Dán link Shopee để tạo mã giảm giá</div>
            </div>
            <div style="color:#ee4d2d;font-weight:bold;">Shopee</div>
        </div>

        <div class="input-box">
            <input id="linkInput" placeholder="Dán link Shopee vào đây..." />
            <button class="paste" onclick="paste()">Dán</button>
        </div>

        <button class="create" onclick="createLink()">Tạo link</button>

        <div id="result"></div>

        <button class="copy" onclick="copyLink()">Copy link</button>
    </div>

    <!-- FB BUTTON -->
    <div class="card">
        <div class="fb-btn">📘 Đến bài đăng Facebook</div>
    </div>

    <!-- HƯỚNG DẪN -->
    <div class="card">
        <b>Hướng dẫn</b>

        <div class="step">
            <div class="number">1</div>
            <div>Dán link rồi nhấn tạo link</div>
        </div>

        <div class="step">
            <div class="number">2</div>
            <div>Nhấn coppy link và comment vào bài viết</div>
        </div>

        <div class="step">
            <div class="number">3</div>
            <div>Nhấn vào link trong comment của mình để lấy mã</div>
        </div>

        <div class="step">
            <div class="number">4</div>
            <div>Mỗi sản phẩm cần tạo link riêng</div>
        </div>
    </div>
<div class="card">
    <div style="font-weight:bold; margin-bottom:10px;">🎁 Mã giảm giá</div>
    
    <img src="https://i.ibb.co/Zp96PNpf/screenshot-1774591589.png" 
     style="width:100%; border-radius:12px;">
</div>
</div>

<script>
let finalLink = "";

async function paste() {
    try {
        const text = await navigator.clipboard.readText();
        document.getElementById("linkInput").value = text;
    } catch {
        alert("Không dán được!");
    }
}

function createLink() {
    let input = document.getElementById("linkInput").value.trim();

    if (!input) {
        alert("Nhập link trước!");
        return;
    }

    let base = "https://shopee.vn/universal-link?af_siteid=17180360000&af_sub_siteid=web&deep_link=";
    let affiliate = base + encodeURIComponent(input);

    fetch("https://tinyurl.com/api-create.php?url=" + encodeURIComponent(affiliate))
    .then(res => res.text())
    .then(shortUrl => {
        finalLink = shortUrl;
        document.getElementById("result").innerText = shortUrl;
    })
    .catch(() => {
        finalLink = affiliate;
        document.getElementById("result").innerText = affiliate;
    });
}

function copyLink() {
    if (!finalLink) {
        alert("Chưa có link!");
        return;
    }

    navigator.clipboard.writeText(finalLink).then(() => {
        alert("Đã copy!");
    });
}
</script>

</body>
</html>
