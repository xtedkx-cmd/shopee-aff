<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Facebook Preview -->
<meta property="og:title" content="🔥 Mã giảm giá Shopee 25% - Giảm tới 1TR">
<meta property="og:description" content="Click để lấy mã giảm giá Shopee mới nhất hôm nay">
<meta property="og:image" content="https://i.ibb.co/4gDTxR4k/voucher.jpg">
<meta property="og:type" content="website">

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f5f5f5;
}

/* HEADER */
.topbar {
    position: sticky;
    top: 0;
    background: linear-gradient(135deg,#ff6a00,#ee4d2d);
    color: white;
    padding: 15px;
    text-align: center;
    font-weight: bold;
}

/* CONTAINER */
.container {
    max-width: 600px;
    margin: auto;
    padding: 15px;
}

/* CARD */
.card {
    background: white;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 15px;
}

/* INPUT */
.input-box {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

input {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 15px;
}

/* BUTTON */
button {
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-weight: bold;
    cursor: pointer;
}

.paste { background:#999; color:white; }
.create { background:#ee4d2d; color:white; width:100%; margin-top:10px;}
.copy { background:#28a745; color:white; width:100%; margin-top:10px;}

#result {
    margin-top: 10px;
    word-break: break-all;
}

/* FB BUTTON */
.fb-btn {
    background:#1877f2;
    color:white;
    padding:14px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
}

/* GUIDE */
.step {
    display:flex;
    margin:10px 0;
}

.number {
    width:25px;
    height:25px;
    background:#ee4d2d;
    color:white;
    border-radius:50%;
    text-align:center;
    line-height:25px;
    margin-right:10px;
}

/* IMAGE */
.full-img {
    width:100%;
    border-radius:12px;
}

/* MOBILE */
@media (max-width:600px){
    .container {
        max-width:100%;
        padding:10px;
    }
}

/* DESKTOP */
@media (min-width:768px){
    body {
        background:#eee;
    }

    .container {
        max-width:500px;
        background:#fff;
        padding:20px;
        border-radius:20px;
        margin-top:30px;
    }
}
</style>
</head>

<body>

<div class="topbar">🛒 Shopee Mã Giảm Giá</div>

<div class="container">

<!-- TOOL -->
<div class="card">
    <b>Tạo link affiliate</b>

    <div class="input-box">
        <input id="linkInput" placeholder="Dán link Shopee..." />
        <button class="paste" onclick="paste()">Dán</button>
    </div>

    <button class="create" onclick="createLink()">Tạo link</button>

    <div id="result"></div>

    <button class="copy" onclick="copyLink()">Copy link</button>
</div>

<!-- FB -->
<div class="card">
    <div class="fb-btn" onclick="goBack()">📘 Quay lại Facebook</div>
</div>

<!-- GUIDE -->
<div class="card">
    <b>Hướng dẫn</b>

    <div class="step"><div class="number">1</div><div>Dán link Shopee</div></div>
    <div class="step"><div class="number">2</div><div>Tạo link & copy</div></div>
    <div class="step"><div class="number">3</div><div>Comment vào bài viết</div></div>
</div>

<!-- VOUCHER -->
<div class="card">
    <b>🎁 Mã giảm giá</b>
    <img class="full-img" src="https://i.ibb.co/Zp96PNpf/screenshot-1774591589.png">
</div>

</div>

<script>
let finalLink = "";

// DÁN LINK
async function paste() {
    try {
        const text = await navigator.clipboard.readText();
        document.getElementById("linkInput").value = text;
    } catch {
        alert("Không dán được!");
    }
}

// TẠO LINK (FIX DOUBLE ENCODE)
function createLink() {
    let input = document.getElementById("linkInput").value.trim();
    if (!input) return alert("Nhập link!");

    let base = "https://shopee.vn/universal-link?af_siteid=17180360000&af_sub_siteid=web&deep_link=";

    // 🔥 làm sạch + encode chuẩn
    let clean = decodeURIComponent(input);
    let affiliate = base + encodeURIComponent(clean);

    // 🔥 rút gọn link
    fetch("https://tinyurl.com/api-create.php?url=" + encodeURIComponent(affiliate))
    .then(res => res.text())
    .then(shortUrl => {
        finalLink = shortUrl;
        document.getElementById("result").innerHTML =
            '<a href="'+shortUrl+'" target="_blank">'+shortUrl+'</a>';
    })
    .catch(() => {
        finalLink = affiliate;
        document.getElementById("result").innerText = affiliate;
    });
}

// COPY
function copyLink() {
    if (!finalLink) return alert("Chưa có link!");

    navigator.clipboard.writeText(finalLink);
    alert("Đã copy!");
}

// BACK FB
function goBack(){
    if(document.referrer){
        window.location.href = document.referrer;
    }else{
        window.location.href = "https://facebook.com";
    }
}
</script>

</body>
</html>
