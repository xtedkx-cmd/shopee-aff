<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopee Affiliate Converter Standard</title>
    <style>
        :root { --primary: #ee4d2d; --bg: #f5f5f5; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .box { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 480px; }
        h2 { color: var(--primary); text-align: center; margin-bottom: 25px; font-size: 1.4rem; }
        .input-wrap { position: relative; margin-bottom: 15px; }
        input { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 12px; box-sizing: border-box; font-size: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); }
        .btn-main { background: var(--primary); color: white; width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        #resultArea { display: none; margin-top: 25px; background: #fff5f2; padding: 15px; border-radius: 12px; border: 1px dashed var(--primary); }
        .url-display { font-size: 13px; color: #555; word-break: break-all; margin-bottom: 10px; line-height: 1.4; }
        .btn-copy { background: #28a745; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <h2>Shopee Link Converter</h2>
    
    <div class="input-wrap">
        <input type="text" id="rawUrl" placeholder="Dán link sản phẩm Shopee...">
    </div>
    
    <button class="btn-main" onclick="processLink()">CHUYỂN ĐỔI CHUẨN</button>

    <div id="resultArea">
        <div style="font-weight: bold; color: var(--primary); margin-bottom: 10px;">Link Affiliate (Mở App 100%):</div>
        <div class="url-display" id="outputUrl"></div>
        <button class="btn-copy" onclick="copyToClipboard()">SAO CHÉP LINK</button>
    </div>
</div>

<script>
    let finalAffiliateUrl = "";

    function processLink() {
        const input = document.getElementById('rawUrl').value.trim();
        if (!input) return alert("Vui lòng nhập link!");

        try {
            // Bước 1: Giải mã toàn bộ link để xử lý ký tự đặc biệt
            let url = decodeURIComponent(input);

            // Bước 2: Dùng Regex tìm Shop ID và Item ID (Cấu trúc i.SHOPID.ITEMID)
            const regex = /i\.(\d+)\.(\d+)/;
            const match = url.match(regex);

            let cleanUrl = "";
            if (match) {
                // Bước 3: Đưa về cấu trúc link sản phẩm "sạch" nhất của Shopee
                // shop_id = match[1], item_id = match[2]
                cleanUrl = `https://shopee.vn/product/${match[1]}/${match[2]}`;
            } else {
                // Nếu không tìm thấy ID, lấy phần URL trước dấu ? (link shop, link trang chủ)
                cleanUrl = url.split('?')[0];
            }

            // Bước 4: Đóng gói với tham số Affiliate của bạn
            const appId = "17180360000"; // Site ID của bạn
            const subId = "web_tool";
            
            // Sử dụng cấu trúc Universal Link chuẩn hóa
            const encodedTarget = encodeURIComponent(cleanUrl);
            finalAffiliateUrl = `https://shopee.vn/universal-link?af_siteid=${appId}&af_sub_siteid=${subId}&pid=custom_link&deep_and_web_url=${encodedTarget}`;

            // Hiển thị kết quả
            document.getElementById('resultArea').style.display = "block";
            document.getElementById('outputUrl').innerText = finalAffiliateUrl;

        } catch (e) {
            alert("Đã có lỗi xảy ra. Hãy đảm bảo bạn dán link Shopee hợp lệ.");
        }
    }

    function copyToClipboard() {
        if (!finalAffiliateUrl) return;
        navigator.clipboard.writeText(finalAffiliateUrl).then(() => {
            alert("Đã copy link chuẩn!");
        });
    }
</script>

</body>
</html>
